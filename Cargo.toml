[package]
name = "kiota"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "From-scratch Lean 4 kernel that re-derives K-likeness and iota"
repository = "https://github.com/sankalpsthakur/kiota"
readme = "README.md"

[lib]
name = "kiota"
path = "src/lib.rs"

[[bin]]
name = "kiota"
path = "src/main.rs"

[dependencies]
serde_json = "1"
rustc-hash = "2"
num-bigint = "0.5.1"
mimalloc = "0.1"

[lints.rust]
# `--cfg kiota_pgo_gen` belongs in the RUSTFLAGS of a `-C profile-generate`
# build only: it makes the binary write its profile before it ends through
# `_exit` (see `finish` in src/main.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kiota_pgo_gen)'] }

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
codegen-units = 1
