[package]
name = "kiota"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "From-scratch Lean 4 kernel that re-derives K-likeness and iota"
repository = "https://github.com/sankalpsthakur/kiota"
readme = "README.md"

[lib]
name = "kiota"
path = "src/lib.rs"

[[bin]]
name = "kiota"
path = "src/main.rs"

[dependencies]
serde_json = "1"
rustc-hash = "2"
num-bigint = "0.5.1"
stacker = "0.1"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
codegen-units = 1
