[package]
name = "lkc"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "From-scratch Lean 4 kernel checker (experimental) for the Lean Kernel Arena"
repository = "https://github.com/sankalpsthakur/lkc"
readme = "README.md"

[dependencies]
serde_json = "1"
rustc-hash = "2"
num-bigint = "0.5.1"

[profile.release]
opt-level = 3
lto = true
panic = "unwind"
codegen-units = 1
