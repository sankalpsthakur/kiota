# Proposed checkers/kiota.yaml for leanprover/lean-kernel-arena.
#
# Only `build:` differs from the file on the arena's master (and `rev:`, which
# must name a commit whose src/main.rs has the `kiota_pgo_gen` cfg; REV below
# is a placeholder). The build is profile-guided, trained on the arena's own
# init export, and falls back to the plain release build, stating why in
# kiota-build.txt, whenever a step of the profile-guided one fails.
#
# Measured on GitHub runners, 2026-11-18 (kiota at e593b79 plus this build
# line; instructions are cachegrind `I refs`, which two builds of one side
# on different runners reproduce to about 0.02%):
#   - the profile, arena's nix toolchain (rustc 1.95.0, LLVM 21.1.8), run
#     44364015792: -11.7% instructions on the first fifth of init (inside
#     the training export), -11.6% summed over twelve fixtures outside it
#     (-4.7% to -17.0% each);
#   - the profile, rustup stable 1.100, run 44344781467: -11.0% on all of
#     init (665.69G -> 592.73G);
#   - `-C target-cpu`, measured as x86-64-v3 because valgrind cannot run the
#     runners' native AVX-512: a further 1.1 to 1.4 points of instructions
#     on both toolchains. In user time native+pgo was not faster than pgo
#     alone (run 44354976061, init, six interleaved cycles: plain 757.0 s,
#     pgo 717.3 s, x86-64-v3+pgo 731.1 s, native+pgo 738.8 s in total);
#   - a larger inline threshold adds nothing on top of the profile.
# The CPU line can be changed to "-C target-cpu=x86-64-v3" or "" without
# touching anything else; the arena's lka.py built and ran all three
# (native under the arena's flake in run 44344781467, the other two under
# rustup in run 44354976061). The binary built with CPU=native runs only on
# the machine that built it; the last step of `pgo` runs it on init there
# and a failure ends in the plain build.
description: |
  **kiota** — a from-scratch Lean 4 kernel in Rust that re-derives
  K-likeness and ι instead of trusting those export fields. Not a
  nanoda fork.
version: "0.1.0"
language: rust
url: https://github.com/sankalpsthakur/kiota
ref: main
rev: REV
build: |
  # POSIX sh, run from _build/checkers/kiota/src. No `set -e`: every step of
  # the profile-guided build is checked, and any failure ends in the plain build.
  ROOT=$(cd ../../../.. && pwd)
  TRAIN="$ROOT/_build/tests/init.ndjson"
  CPU="-C target-cpu=native"
  WHY=""
  pgo() {
    WHY="no init export to train on"
    "$ROOT/lka.py" build-test init || return 1
    [ -s "$TRAIN" ] || return 1
    WHY="the instrumented build failed"
    # `--cfg kiota_pgo_gen` makes the binary write its profile (it ends through
    # `_exit`). It is in RUSTFLAGS and not a cargo feature because the two
    # builds must mangle names alike for the profile to apply.
    RUSTFLAGS="$CPU -C profile-generate=$PWD/pgo --cfg kiota_pgo_gen" cargo build --release --locked \
      --target-dir "$PWD/target-pgo-gen" || return 1
    # The build scripts cargo just ran were instrumented too and left their
    # own profiles here. Only the training run's may be merged.
    rm -rf "$PWD/pgo" "$PWD/pgo.profdata"
    WHY="the training run did not accept init"
    timeout 3600 "$PWD/target-pgo-gen/release/kiota" "$TRAIN" >/dev/null 2>&1 || return 1
    WHY="the training run wrote no profile"
    [ -n "$(find "$PWD/pgo" -name '*.profraw' -size +200 2>/dev/null)" ] || return 1
    WHY="no llvm-profdata could merge the profile"
    MERGED=""
    for P in "$(rustc --print sysroot)"/lib/rustlib/*/bin/llvm-profdata "$(command -v llvm-profdata)"; do
      if [ -x "$P" ] && "$P" merge -o "$PWD/pgo.profdata" "$PWD/pgo"; then MERGED=1; break; fi
    done
    [ -n "$MERGED" ] || return 1
    WHY="the profile-guided build failed"
    RUSTFLAGS="$CPU -C profile-use=$PWD/pgo.profdata" cargo build --release --locked || return 1
    WHY="the profile-guided binary did not accept init"
    timeout 3600 target/release/kiota "$TRAIN" >/dev/null 2>&1 || return 1
  }
  if pgo; then
    echo "KIOTA_BUILD=pgo" | tee kiota-build.txt
  else
    echo "KIOTA_BUILD=plain reason=$WHY" | tee kiota-build.txt
    cargo build --release --locked
  fi
run: ./target/release/kiota "$IN"
timeout: 5680
