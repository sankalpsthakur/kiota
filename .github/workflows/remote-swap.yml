name: remote-swap

# fix/mathlib-swap on the arena's Lean 4.36 exports (init, std, cedar, cslib,
# mathlib), strict, one process each: verdict, user time, peak memory. main
# runs the four small corpora beside it for a same-runner time comparison.
on:
  push:
    branches: ['remote/swap-*']
permissions:
  contents: read
  actions: read
env:
  EXPORTS_RUN: 45472434965
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        side: [fix/mathlib-swap, main]
        corpus: [init, std, cedar, cslib, mathlib]
        exclude:
          - side: main
            corpus: mathlib
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; df -h .
          # Per-declaration progress on mathlib only, so a kill names the declaration.
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          export KIOTA_ABBREV_STATS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a spinning declaration ends with its name
          # (the last `[decl #N]` line) instead of a dead runner.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "lazy retries: $(grep -c '^LAZY_RETRY' err.txt)"; grep '^LAZY_RETRY' err.txt | tail -20
          echo "abbrev: $(grep '^ABBREV_ARGS budget' err.txt) exhausted_lines=$(grep -c '^ABBREV_ARGS exhausted' err.txt)"
          grep -B1 '^ABBREV_ARGS exhausted' err.txt | head -40
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"
