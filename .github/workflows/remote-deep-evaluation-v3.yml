name: remote-deep-evaluation-v3

# fix/deep-evaluation-v3 (origin/main f7c0960 + fix/deep-evaluation-v2 + the
# round-2 review's items) beside main f7c0960. Both refs are pinned by sha.
# - tests: cargo test --release on the head; nbe: KIOTA_NBE=1 on both sides.
# - tarball: every case of the arena tarball on both sides (rc, user, rss).
# - val: the six Lean 4.36 corpora on both sides, strict, one process each.
# - mutant: each mutant of scripts-mut/mutate.py against the release suite,
#   M00_none is the control.
# - scale: the adversarial exports (2^19..2^21, 1M-3M) on both sides.
on:
  push:
    branches: ['remote/deep-evaluation-v3-20261127']
permissions:
  contents: read
  actions: read
env:
  HEAD_SHA: 0f9d6e54c957eb6003981d536568bb8e1bf69caa
  MAIN: f7c09605e8fe7dc7ddcb3b1650aeb259793ee3aa
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --release
        shell: bash
        run: |
          set +e
          cargo test --release --locked --no-fail-fast > test.log 2>&1; trc=$?
          grep -E '^test result:|panicked|^error|FAILED' test.log | head -60
          failed=$(grep -E '^test .* FAILED$' test.log | awk '{print $2}' | tr '\n' ' ')
          passed=$(grep -E '^test result:' test.log | awk '{s+=$4} END{print s}')
          echo "TESTS sha=$(git rev-parse --short HEAD) rc=$trc passed=$passed failed=[$failed]" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $trc

  tarball:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Every tarball case
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y time >/dev/null
          mkdir -p arena && curl -sL https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena.tgz
          sha256sum arena.tgz; tar -xzf arena.tgz -C arena
          sha=$(git rev-parse --short HEAD)
          for f in $(cd arena && find good bad -name '*.ndjson' | sort); do
            /usr/bin/time -v -o time.txt timeout 900 ./target/release/kiota "arena/$f" >/dev/null 2>err.txt
            rc=$?
            echo "TB side=$SIDE sha=$sha case=$f rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-160)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  nbe:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - name: KIOTA_NBE=1 cargo test --release
        shell: bash
        run: |
          set +e
          KIOTA_NBE=1 timeout 7200 cargo test --release --locked --no-fail-fast > test.log 2>&1; trc=$?
          grep -E '^test result:' test.log
          failed=$(grep -E '^test .* FAILED$' test.log | awk '{print $2}' | sort | tr '\n' ' ')
          echo "NBE side=${{ matrix.side }} sha=$(git rev-parse --short HEAD) rc=$trc failed=[$failed]" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

  val:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
        corpus: [init, std, cedar, cslib, mathlib, con-leche]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib' || matrix.corpus == 'con-leche'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && '45661537211' || '45472434965' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson; df -h .
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          export KIOTA_NAT_REPORT=1
          start=$(date +%s)
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') wall=${wall}s $(grep -m1 '^NAT_DRIVE' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"

  mutlist:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.l.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "ids=$(python3 -I scripts-mut/mutate.py --list | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')" >> $GITHUB_OUTPUT

  mutant:
    needs: mutlist
    strategy:
      fail-fast: false
      matrix:
        mutant: ${{ fromJson(needs.mutlist.outputs.ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: h
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: k
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply, build and test
        shell: bash
        env:
          MUT: ${{ matrix.mutant }}
        run: |
          set +e
          cd k
          python3 -I ../h/scripts-mut/mutate.py "$MUT" .; arc=$?
          if [ $arc != 0 ]; then echo "MUT mutant=$MUT sha=$(git rev-parse --short HEAD) status=MUT_ERROR (apply rc=$arc)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git diff --stat
          cargo build --release --locked --tests > build.log 2>&1; brc=$?
          if [ $brc != 0 ]; then grep -E '^error' -A5 build.log | head -20; echo "MUT mutant=$MUT sha=$(git rev-parse --short HEAD) status=MUT_ERROR (build rc=$brc)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          timeout 3600 cargo test --release --locked --no-fail-fast > test.log 2>&1; trc=$?
          failed=$(grep -E '^test .* FAILED$' test.log | awk '{print $2}' | sort | tr '\n' ' ')
          passed=$(grep -E '^test result:' test.log | awk '{s+=$4} END{print s}')
          grep -E '^test result:|panicked at' test.log | head -30
          if [ $trc = 124 ]; then status=TIMEOUT; elif [ -n "$failed" ]; then status=KILLED; elif [ $trc != 0 ]; then status=TEST_RC_$trc; else status=SURVIVED; fi
          echo "MUT mutant=$MUT sha=$(git rev-parse --short HEAD) status=$status test_rc=$trc passed=$passed failed=[$failed]" | tee -a "$GITHUB_STEP_SUMMARY"

  scalebuild:
    strategy:
      matrix:
        side: [head, main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && git rev-parse HEAD > target/release/SHA
      - uses: actions/upload-artifact@v4
        with:
          name: kiota-${{ matrix.side }}
          path: |
            target/release/kiota
            target/release/SHA

  scalelist:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.l.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "cases=$(ls adv/r1/*.ndjson adv/r2rev/*.ndjson | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin]))')" >> $GITHUB_OUTPUT

  scale:
    needs: [scalebuild, scalelist]
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        side: [head, main]
        case: ${{ fromJson(needs.scalelist.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kiota-${{ matrix.side }}
          path: bin
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
          F: ${{ matrix.case }}
        run: |
          set +e
          chmod +x bin/kiota
          sudo apt-get install -y time >/dev/null 2>&1
          n=$(basename $F .ndjson)
          exp=x; case $n in *_ok) exp=0;; *_bad) exp=1;; esac
          KIOTA_NAT_REPORT=1 /usr/bin/time -v -o time.txt timeout 600 bin/kiota $F >o.txt 2>err.txt; rc=$?
          flag=ok
          [ "$exp" = 1 ] && [ $rc = 0 ] && flag=WRONG_ACCEPT
          [ "$exp" = 0 ] && [ $rc = 1 ] && flag=WRONG_REJECT
          [ $rc = 124 ] && flag=TIMEOUT
          [ $rc -gt 2 ] && [ $rc != 124 ] && flag=CRASH
          tail -c 600 err.txt
          echo "SCALE side=$SIDE sha=$(cut -c1-7 bin/SHA) case=$F exp=$exp rc=$rc $flag user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 '^NAT_DRIVE' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)|panic|overflow' err.txt | cut -c1-160)" | tee -a "$GITHUB_STEP_SUMMARY"
