name: remote-indaudit2

# snd/inductive-audit-2 on the arena's Lean 4.36 exports (init, std, cedar,
# cslib) and the con-leche arena export, strict, one process each: verdict,
# user time, peak memory. snd/inductive-audit (9bb4388) runs beside it for a
# same-runner time comparison. Mathlib runs on snd/inductive-audit-2-swap,
# the branch merged with fix/mathlib-swap, which 4.36 mathlib needs.
on:
  push:
    branches: ['remote/indaudit2-*']
permissions:
  contents: read
  actions: read
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {side: snd/inductive-audit-2, corpus: init, run: '45472434965'}
          - {side: snd/inductive-audit-2, corpus: std, run: '45472434965'}
          - {side: snd/inductive-audit-2, corpus: cedar, run: '45472434965'}
          - {side: snd/inductive-audit-2, corpus: cslib, run: '45472434965'}
          - {side: snd/inductive-audit-2, corpus: con-leche, run: '44328282978'}
          - {side: snd/inductive-audit, corpus: init, run: '45472434965'}
          - {side: snd/inductive-audit, corpus: std, run: '45472434965'}
          - {side: snd/inductive-audit, corpus: cedar, run: '45472434965'}
          - {side: snd/inductive-audit, corpus: cslib, run: '45472434965'}
          - {side: snd/inductive-audit, corpus: con-leche, run: '44328282978'}
          - {side: snd/inductive-audit-2-swap, corpus: mathlib, run: '45472434965'}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson; df -h .
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a spinning declaration ends with its name.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"
