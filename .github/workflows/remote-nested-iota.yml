name: remote-nested-iota

# fix/nested-iota-from-declaration on the arena's six Lean 4.36 exports
# (init, std, cedar, cslib, mathlib, con-leche), strict, one process each:
# verdict, user time, peak memory, side by side with main. mathlib OOMs on
# main near decl #284,600 (a separate defeq runaway fixed on fix/mathlib-swap),
# so mathlib and con-leche also run fix/mathlib-swap alone and the merge
# fix/nested-iota-swap. con-leche is exported here at the board's pin and
# compared with the board's sha256.
on:
  push:
    branches: ['remote/nested-iota-*']
permissions:
  contents: read
  actions: read
env:
  EXPORTS_RUN: 45472434965
jobs:
  conleche-export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SRC_URL: https://github.com/leanprover/con-leche
      SRC_REV: cd2eceab2e9b10404c663b468639c8aa99d0d1f2
      WANT_SHA256: 799c9744ccb5d10bf5ffb0ea63bc11532aaaf95d7eecc678ec43175f18f66f1c
    steps:
      - name: Install elan and zstd
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y zstd >/dev/null
      - name: Source
        run: |
          mkdir -p work/src && cd work/src
          git init -q && git remote add origin "$SRC_URL"
          git fetch -q --depth 1 origin "$SRC_REV" && git checkout -q FETCH_HEAD
          cat lean-toolchain
      - name: Build lean4export
        run: |
          git clone -q --branch master https://github.com/leanprover/lean4export lean4export
          cp work/src/lean-toolchain lean4export/lean-toolchain
          cd lean4export && git rev-parse HEAD && lake build
      - name: Build module (lka.py)
        working-directory: work/src
        run: |
          start=$(date +%s)
          lake build ConLecheTests
          echo "lake build seconds: $(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Export (lka.py run_lean4export)
        working-directory: work/src
        run: |
          X="$GITHUB_WORKSPACE/lean4export/.lake/build/bin/lean4export"
          lake env "$X" ConLecheTests -- ConLeche.model_exists ConLeche.no_proof_of_False ConLeche.Frontend.scanLineSpec_eq_scanLineFwd > "$GITHUB_WORKSPACE/con-leche.ndjson"
          cd "$GITHUB_WORKSPACE"
          got=$(sha256sum con-leche.ndjson | awk '{print $1}')
          echo "EXPORT con-leche size=$(stat -c %s con-leche.ndjson) lines=$(wc -l < con-leche.ndjson) sha256=$got board=$WANT_SHA256 match=$([ "$got" = "$WANT_SHA256" ] && echo yes || echo no)" | tee -a "$GITHUB_STEP_SUMMARY"
          zstd -q -T0 -10 con-leche.ndjson -o con-leche.ndjson.zst
      - uses: actions/upload-artifact@v4
        with:
          name: export-con-leche
          path: con-leche.ndjson.zst
          compression-level: 0
          retention-days: 7

  val:
    strategy:
      fail-fast: false
      matrix:
        side: [main, fix/nested-iota-from-declaration, fix/nested-iota-swap, fix/mathlib-swap]
        corpus: [init, std, cedar, cslib, mathlib]
        exclude:
          - {side: fix/mathlib-swap, corpus: init}
          - {side: fix/mathlib-swap, corpus: std}
          - {side: fix/mathlib-swap, corpus: cedar}
          - {side: fix/mathlib-swap, corpus: cslib}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a runaway ends with its declaration named.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"

  val-conleche:
    needs: conleche-export
    strategy:
      fail-fast: false
      matrix:
        side: [main, fix/nested-iota-from-declaration, fix/nested-iota-swap, fix/mathlib-swap]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-con-leche
      - name: Strict run
        env:
          C: con-leche
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson
          start=$(date +%s)
          /usr/bin/time -v -o time.txt timeout 5000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          wall=$(( $(date +%s) - start ))
          tail -c 3000 err.txt
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"
