name: remote-swaprev-val

# Independent review run: fix/mathlib-swap-v2 at the reviewed sha bcb623d (HEAD) beside its base
# fix/integrate-20261125 (BASE 3fd8d86): the arena's six Lean 4.36 exports,
# strict, one process each (verdict, user time, peak RSS), the swap cone, and
# the whole arena tarball (every good/* and bad/* case, perf included) on both
# sides. Both refs are pinned by full sha. KIOTA_ABBREV_STATS is set on HEAD
# only for mathlib and the cone (it prints at exit and per exhausted frame).
on:
  push:
    branches: ['remote/swaprev-val-*']
permissions:
  contents: read
  actions: read
env:
  HEAD_SHA: bcb623d3ae6ddb1e57b9be4c908022776d815645
  BASE_SHA: 3fd8d8687f100f30fd791d3f502bb92c29d2d761
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
        corpus: [mathlib, init, std, cedar, cslib, con-leche]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'head' && env.HEAD_SHA || env.BASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && sha256sum target/release/kiota && git rev-parse HEAD
      - name: Free disk
        if: matrix.corpus == 'mathlib' || matrix.corpus == 'con-leche'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && '45661537211' || '45472434965' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          [ "$C" = mathlib ] && [ "$SIDE" = head ] && export KIOTA_ABBREV_STATS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a runaway ends with its declaration named.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | grep -v '^ABBREV_HIST' | tail -c 4000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') wall=${wall}s $(grep -m1 '^ABBREV_ARGS budget' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"

  cone:
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'head' && env.HEAD_SHA || env.BASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && sha256sum target/release/kiota && git rev-parse HEAD
      - uses: actions/download-artifact@v4
        with:
          name: cone-mathlib
          run-id: '45475819157'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The Polynomial.Bivariate.swap cone
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm mathlib.ndjson.zst -o cone.ndjson
          sha256sum cone.ndjson
          [ "$SIDE" = head ] && export KIOTA_ABBREV_STATS=1
          /usr/bin/time -v -o time.txt timeout 900 ./target/release/kiota cone.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" >> err.txt; kill -9 $k; fi
            fi
            sleep 1
          done
          wait $pid; rc=$?
          grep -E '^ABBREV_(ARGS|DECL|TOP)' err.txt | head -30
          echo "CONE side=$SIDE sha=$(git rev-parse --short HEAD) rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-200)" | tee -a "$GITHUB_STEP_SUMMARY"

  tarball:
    strategy:
      fail-fast: false
      matrix:
        side: [head, base]
        part: [nonperf, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'head' && env.HEAD_SHA || env.BASE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked && sha256sum target/release/kiota && git rev-parse HEAD
      - name: Arena tarball, every case
        env:
          SIDE: ${{ matrix.side }}
          PART: ${{ matrix.part }}
        run: |
          set +e
          sudo apt-get install -y time >/dev/null
          mkdir -p arena && curl -sL https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena.tgz
          sha256sum arena.tgz; tar -xzf arena.tgz -C arena
          sha=$(git rev-parse --short HEAD)
          if [ "$PART" = perf ]; then
            files=$(ls arena/good/perf/*.ndjson arena/bad/perf/*.ndjson); to=1800
          else
            files=$(find arena -name '*.ndjson' -not -path '*/perf/*' | sort); to=300
          fi
          for f in $files; do
            case_=${f#arena/}
            /usr/bin/time -v -o time.txt timeout $to ./target/release/kiota "$f" >/dev/null 2>err.txt &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              k=$(pgrep -x kiota | head -1)
              if [ -n "$k" ]; then
                rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
                if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" >> err.txt; kill -9 $k; fi
              fi
              sleep 1
            done
            wait $pid; rc=$?
            echo "TAR side=$SIDE sha=$sha case=$case_ rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-160)" | tee -a tar.txt
          done
          cat tar.txt >> "$GITHUB_STEP_SUMMARY"
