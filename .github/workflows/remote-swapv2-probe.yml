name: remote-swapv2-probe

# Measurement round for fix/mathlib-swap-v2 (f3a0383 = 3fd8d86 + fix/mathlib-swap
# af180e9 + KIOTA_ABBREV_STATS instrumentation). Not a validation run: every
# side runs with KIOTA_ABBREV_STATS=1. It answers
#   - how the abbrev argument frames' work and wall time are distributed on
#     the six Lean 4.36 corpora and the swap cone, and which frames exhaust;
#   - what mathlib does at budgets 100k, 300k, 3M besides the default 1M
#     (rc, user time, peak RSS): a lower budget discards the largest genuine
#     frames, which is the fragility question asked directly;
#   - what the path after an exhausted frame costs when every other frame
#     keeps its full budget (KIOTA_ABBREV_EXHAUST=every:N);
#   - whether nested_rec_for_type is reached at all (NESTED_REC line).
on:
  push:
    branches: ['remote/swapv2-probe-*']
permissions:
  contents: read
  actions: read
env:
  HEAD_SHA: f3a03839900f8df4c674f53a1e4ecb751be88f62
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {corpus: mathlib, budget: '', exhaust: ''}
          - {corpus: mathlib, budget: '100000', exhaust: ''}
          - {corpus: mathlib, budget: '300000', exhaust: ''}
          - {corpus: mathlib, budget: '3000000', exhaust: ''}
          - {corpus: mathlib, budget: '', exhaust: 'every:1000'}
          - {corpus: init, budget: '', exhaust: ''}
          - {corpus: std, budget: '', exhaust: ''}
          - {corpus: cedar, budget: '', exhaust: ''}
          - {corpus: cslib, budget: '', exhaust: ''}
          - {corpus: con-leche, budget: '', exhaust: ''}
          - {corpus: init, budget: '', exhaust: 'every:100'}
          - {corpus: std, budget: '', exhaust: 'every:100'}
          - {corpus: cedar, budget: '', exhaust: 'every:100'}
          - {corpus: cslib, budget: '', exhaust: 'every:100'}
          - {corpus: con-leche, budget: '', exhaust: 'every:100'}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib' || matrix.corpus == 'con-leche'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && '45661537211' || '45472434965' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run with frame statistics
        env:
          C: ${{ matrix.corpus }}
          B: ${{ matrix.budget }}
          X: ${{ matrix.exhaust }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          sha256sum $C.ndjson
          export KIOTA_ABBREV_STATS=1
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          [ -n "$B" ] && export KIOTA_ABBREV_ARGS_BUDGET=$B
          [ -n "$X" ] && export KIOTA_ABBREV_EXHAUST=$X
          start=$(date +%s)
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -E '^(ABBREV_|NESTED_REC|LAZY_RETRY|MEMKILL|REJECT|DECLINE|ERROR)' err.txt | head -400
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          tag="budget=${B:-default} exhaust=${X:-none}"
          echo "PROBE sha=$(git rev-parse --short HEAD) corpus=$C $tag rc=$rc wall=${wall}s user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 '^ABBREV_ARGS budget' err.txt) $(grep -m1 '^NESTED_REC' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-200)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(ABBREV_|NESTED_REC)' err.txt > stats-$C.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stats-${{ matrix.corpus }}-${{ matrix.budget || 'default' }}-${{ matrix.exhaust && 'x' || 'n' }}
          path: stats-*.txt

  cone:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: cone-mathlib
          run-id: '45475819157'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The swap cone and the abbrev fixture under budgets and forced exhaustion
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm mathlib.ndjson.zst -o cone.ndjson
          sha256sum cone.ndjson
          export KIOTA_ABBREV_STATS=1
          one() {  # <label> <file> <timeout>; extra env from the caller
            /usr/bin/time -v -o time.txt timeout $3 ./target/release/kiota "$2" >/dev/null 2>err.txt &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              k=$(pgrep -x kiota | head -1)
              if [ -n "$k" ]; then
                rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
                if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" >> err.txt; kill -9 $k; fi
              fi
              sleep 1
            done
            wait $pid; rc=$?
            grep -E '^ABBREV_(ARGS exhausted|DECL)' err.txt | head -20
            echo "CONE $1 rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 '^ABBREV_ARGS budget' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-200)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          for b in 1000000 100000 300000 3000000 10000000; do
            KIOTA_ABBREV_ARGS_BUDGET=$b one "cone budget=$b" cone.ndjson 1800
          done
          F=tests/fixtures/abbrev-coe-of-comp.accept.ndjson
          one "fixture default" $F 120
          n=$(grep '^ABBREV_ARGS budget' err.txt | sed 's/.*frames=//')
          echo "fixture frames=$n"
          for b in 1 2 3 5 8 13; do
            KIOTA_ABBREV_ARGS_BUDGET=$b one "fixture budget=$b" $F 120
          done
          for k in $(seq 1 $(( ${n:-0} < 300 ? ${n:-0} : 300 ))); do
            KIOTA_ABBREV_EXHAUST=only:$k one "fixture only:$k" $F 120
          done
          KIOTA_ABBREV_EXHAUST=every:1 one "fixture every:1" $F 120
