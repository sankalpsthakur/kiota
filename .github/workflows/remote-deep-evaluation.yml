name: remote-deep-evaluation

# fix/deep-evaluation-v2 (48d83ba: the closed-Nat driver and cut-short
# declines) beside its base fix/integrate-20261125 (3fd8d86), both pinned by
# sha: the six Lean 4.36 corpora strict (verdict, user time, peak memory, and
# on v2 the driver counters), every arena tarball case, and the test suite in
# the three modes the arena gate uses.
on:
  push:
    branches: ['remote/deep-evaluation-v2-*']
permissions:
  contents: read
  actions: read
env:
  V2: 48d83ba4e8240f0ff9c71e59cc2a0a38e94ae09a
  INTEG: 3fd8d8687f100f30fd791d3f502bb92c29d2d761
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        side: [v2, integrate]
        corpus: [init, std, cedar, cslib, mathlib, con-leche]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'v2' && env.V2 || env.INTEG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib' || matrix.corpus == 'con-leche'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && '45661537211' || '45472434965' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
          KIOTA_NAT_REPORT: '1'
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson; df -h .
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a runaway ends with its declaration named.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 '^NAT_DRIVE' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"

  tarball:
    strategy:
      fail-fast: false
      matrix:
        side: [v2, integrate]
        part: [perf, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'v2' && env.V2 || env.INTEG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Arena tarball cases
        env:
          SIDE: ${{ matrix.side }}
          PART: ${{ matrix.part }}
          KIOTA_NAT_REPORT: '1'
        run: |
          set +e
          sudo apt-get install -y time >/dev/null
          mkdir -p arena && curl -sL https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena.tgz
          sha256sum arena.tgz; tar -xzf arena.tgz -C arena
          sha=$(git rev-parse --short HEAD)
          one() {  # <file> <timeout>
            /usr/bin/time -v -o time.txt timeout $2 ./target/release/kiota "$1" >/dev/null 2>err.txt &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              k=$(pgrep -x kiota | head -1)
              if [ -n "$k" ]; then
                rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
                if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" >> err.txt; kill -9 $k; fi
              fi
              sleep 1
            done
            wait $pid; rc=$?
          }
          if [ "$PART" = perf ]; then files=$(ls arena/good/perf/*.ndjson arena/bad/perf/*.ndjson)
          else files=$(ls arena/good/*/*.ndjson arena/bad/*/*.ndjson | grep -v '/perf/'); fi
          for f in $files; do
            case_=${f#arena/}
            one "$f" 1800
            echo "PERF side=$SIDE sha=$sha case=$case_ rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed (wall' time.txt | awk '{print $NF}') $(grep -m1 '^NAT_DRIVE' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-200)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  tests:
    strategy:
      fail-fast: false
      matrix:
        mode: [default, nbe, reclaim, debug]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.V2 }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          case "$MODE" in
            nbe) KIOTA_NBE=1 cargo test --release --locked 2>&1 | tee test.log ;;
            reclaim) KIOTA_RECLAIM=1 cargo test --release --locked 2>&1 | tee test.log ;;
            debug) cargo test --locked 2>&1 | tee test.log ;;
            *) cargo test --release --locked 2>&1 | tee test.log ;;
          esac
          rc=$?
          grep -E '^test result|FAILED|panicked' test.log | head -40
          echo "TESTS mode=$MODE rc=$rc $(grep -E '^test result' test.log | awk '{p+=$4; f+=$6; i+=$8} END {print "passed=" p " failed=" f " ignored=" i}')" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
