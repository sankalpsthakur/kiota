name: remote-cache-cost

# What each rule of the cross-declaration cache discipline costs on std:
# the same source with one rule switched off by a one-line patch.
on:
  push:
    branches: ['remote/cache-soundness-20261118c']

permissions:
  contents: read
  actions: read

env:
  EXPORTS_RUN: 44313744961

jobs:
  cost:
    strategy:
      fail-fast: false
      matrix:
        variant: [no-xcache-clear-at-reset, no-clear-at-reset]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch
        env:
          V: ${{ matrix.variant }}
        run: |
          set -e
          if [ $V = no-xcache-clear-at-reset ]; then
            sed -i '/^            xcache_clear();$/d' src/tc.rs
          fi
          if [ $V = no-clear-at-reset ]; then
            python3 - <<'PY'
          p = 'src/tc.rs'; s = open(p).read()
          old = "            xcache_clear();\n            expr::clear_subst_memos();\n            expr::intern_clear_if_large(INTERN_RESET);"
          assert s.count(old) == 1
          open(p, 'w').write(s.replace(old, "            expr::intern_clear_if_large(INTERN_RESET);"))
          PY
          fi
          git diff --stat
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-std
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: std with KIOTA_XCACHE and with both
        env:
          V: ${{ matrix.variant }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm std.ndjson.zst -o std.ndjson
          for side in xcache both; do
            extra="KIOTA_XCACHE=1"; [ $side = both ] && extra="KIOTA_XCACHE=1 KIOTA_XMEMO=1"
            env $extra KIOTA_STATS=1 /usr/bin/time -v -o time.txt ./target/release/kiota std.ndjson >/dev/null 2>err.txt; rc=$?
            echo "COST variant=$V side=$side rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -E '^STATS3' err.txt | tail -1) $(grep -E '^STATS ' err.txt | tail -1) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-100)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
