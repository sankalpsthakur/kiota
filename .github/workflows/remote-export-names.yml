name: remote-export-names

# snd/export-names on every corpus, strict, one process each. A corpus that
# accepts has no name line with an undefined prefix, no respelled index, no
# undefined table reference and no recursor whose rule list or k differs
# from reconstruction; the NAMES line counts second indices for a name.
on:
  push:
    branches: ['remote/export-names-2026*']

permissions:
  contents: read
  actions: read

env:
  EXPORTS_RUN: 44313744961
  CL_EXPORT_RUN: 44328282978

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked 2>&1 | tee test.txt; grep -E '^test result' test.txt | tee -a "$GITHUB_STEP_SUMMARY"; ! grep -q -E 'FAILED|^error' test.txt
  full:
    strategy:
      fail-fast: false
      matrix:
        corpus: [mathlib, cedar, cslib, std, init, con-leche]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && env.CL_EXPORT_RUN || env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          nproc; free -g | head -2
          KIOTA_PROGRESS=1 /usr/bin/time -v -o time.txt timeout 20000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          echo "FULL corpus=$C rc=$rc decls=$(grep -c '\[decl #' err.txt) last=$(grep -o '\[decl #[0-9]*\]' err.txt | tail -1) wall=$(grep Elapsed time.txt | awk '{print $NF}') user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 '^NAMES' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-300)" | tee -a "$GITHUB_STEP_SUMMARY"
