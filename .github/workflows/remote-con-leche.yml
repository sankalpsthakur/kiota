name: remote-con-leche-cone-order

# The cone of one con-leche declaration, exported on its own (run
# 44346066557, artifact hot-cones), costs far more than the same
# declarations inside the arena export: cone-8 (defeqLoop_shift, 787,289
# lines) 334 s and 8.0 GB against under 60 s and 0.6 GB for the whole
# prefix up to that declaration in the arena order. Which declaration, and
# is it the eager pass or a lazy retry? base = e593b79's tc.rs.
on:
  push:
    branches: ['remote/con-leche-2026*']

permissions:
  contents: read
  actions: read

jobs:
  cone:
    strategy:
      fail-fast: false
      matrix:
        cone: [cone-8, cone-1, cone-6]
        side: [base, fix2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          SIDE: ${{ matrix.side }}
        run: |
          [ "$SIDE" = base ] && git checkout -q e593b79 -- src/tc.rs
          git status --short
          cargo build --release
      - uses: actions/download-artifact@v4
        with:
          name: hot-cones
          run-id: 44346066557
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
          C: ${{ matrix.cone }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          cat cones/index.txt | head -8
          zstd -d cones/$C.ndjson.zst -o $C.ndjson
          KIOTA_PROGRESS=1 KIOTA_KEEP_GOING=1 KIOTA_STATS=1 KIOTA_SLOW_MS=1000 /usr/bin/time -v -o time.txt timeout 2400 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          {
            echo "CL cone=$C side=$SIDE rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') decls=$(grep -c '^\[decl' err.txt) declines=$(grep -c '^DECLINE-CONT' err.txt) lazy_retries=$(grep -c '^LAZY_RETRY' err.txt) $(grep -E '^STATS ' err.txt | tail -1)"
            grep -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-400 | head -20
            grep -E '^LAZY_RETRY' err.txt | cut -c1-260 | head -40
            grep -E '^SLOW' err.txt | cut -c1-300 | head -60
          } | tee -a "$GITHUB_STEP_SUMMARY"
