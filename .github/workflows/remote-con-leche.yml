name: remote-con-leche

# The con-leche arena test (leanprover/con-leche 78ded4b6, module
# ConLecheTests, three export-decls; export built by run 44328282978,
# sha256 b9ad1d95..., identical to the board's) and the standing corpora on
# perf/ws-con-leche fd7248f (lazy pass leaves ite/dite/Decidable.decide to
# lazy delta) plus the keep-going and slow-declaration diagnostics.
#   fix2     this branch
#   noshort  this branch with KIOTA_NO_DECIDE_SHORTCUT=1
# Base and 132463b numbers on the same exports are in run 44331616042.
on:
  push:
    branches: ['remote/con-leche-2026*']

permissions:
  contents: read
  actions: read

env:
  CL_EXPORT_RUN: 44328282978
  EXPORTS_RUN: 44313744961

jobs:
  con-leche:
    strategy:
      fail-fast: false
      matrix:
        side: [fix2, noshort]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (the arena's build line)
        run: |
          git log --oneline -1
          cargo build --release
      - uses: actions/download-artifact@v4
        with:
          name: export-con-leche
          run-id: ${{ env.CL_EXPORT_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm con-leche.ndjson.zst -o con-leche.ndjson
          sha256sum con-leche.ndjson; nproc; free -g | head -2
          extra="A=1"; [ "$SIDE" = noshort ] && extra="KIOTA_NO_DECIDE_SHORTCUT=1"
          {
            # the arena's own invocation, twice: verdict and cost without diagnostics (test timeout 720 s)
            for i in 1 2; do
              env $extra /usr/bin/time -v -o time.txt timeout 720 ./target/release/kiota con-leche.ndjson >out0.txt 2>err0.txt; rc=$?
              echo "CL corpus=con-leche side=$SIDE mode=plain try=$i rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') sys=$(grep 'System time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}')"
              grep -E '^(REJECT|DECLINE|ERROR)' err0.txt | cut -c1-600
            done
            env $extra KIOTA_KEEP_GOING=1 KIOTA_STATS=1 KIOTA_SLOW_MS=1000 /usr/bin/time -v -o time.txt timeout 3000 ./target/release/kiota con-leche.ndjson >/dev/null 2>err.txt; rc=$?
            echo "CL corpus=con-leche side=$SIDE mode=keep-going rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') declines=$(grep -c '^DECLINE-CONT' err.txt) slow=$(grep -c '^SLOW' err.txt) $(grep -E '^STATS ' err.txt | tail -1)"
            grep -E '^STATS[23]' err.txt | tail -2
            grep -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-600 | head -100
            echo "--- lazy retries"
            grep -c '^LAZY_RETRY' err.txt
            grep -E '^LAZY_RETRY' err.txt | cut -c1-260 | head -120
            echo "--- declarations over 1000 ms or growing the resident set by 256 MB"
            grep -E '^SLOW' err.txt | cut -c1-300 | head -400
          } | tee -a "$GITHUB_STEP_SUMMARY"
          zstd -q -10 err.txt -o kiota-stderr-$SIDE.txt.zst
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stderr-${{ matrix.side }}
          path: kiota-stderr-*.txt.zst
          if-no-files-found: ignore
          retention-days: 30

  corpus:
    strategy:
      fail-fast: false
      matrix:
        corpus: [init, std, cedar, cslib, mathlib]
        side: [fix2]
        include:
          - corpus: init
            side: noshort
          - corpus: std
            side: noshort
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          git log --oneline -1
          cargo build --release --locked
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          extra="A=1"; [ "$SIDE" = noshort ] && extra="KIOTA_NO_DECIDE_SHORTCUT=1"
          env $extra KIOTA_STATS=1 KIOTA_SLOW_MS=5000 /usr/bin/time -v -o time.txt ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          {
            echo "CL corpus=$C side=$SIDE rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') lazy_retries=$(grep -c '^LAZY_RETRY' err.txt) $(grep -E '^STATS ' err.txt | tail -1)"
            grep -E '^STATS[23]' err.txt | tail -2
            grep -E '^LAZY_RETRY' err.txt | cut -c1-300 | head -40
            grep -E '^SLOW' err.txt | cut -c1-300 | head -60
            grep -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-600 | head -20
          } | tee -a "$GITHUB_STEP_SUMMARY"
