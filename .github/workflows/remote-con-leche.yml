name: remote-con-leche

# The con-leche arena test (leanprover/con-leche 78ded4b6, module
# ConLecheTests, three export-decls) and the standing corpora, each under
# three configurations of the same source tree:
#   base   e593b79 + the keep-going diagnostic (commit 3177d60)
#   fix    this branch (lazy pass leaves ite/dite to lazy delta)
#   noite  this branch with KIOTA_NO_ITE_SHORTCUT=1
# Verdict, every decline (KIOTA_KEEP_GOING), counters, user time, peak RSS.
on:
  push:
    branches: ['remote/con-leche-2026*']

permissions:
  contents: read
  actions: read

env:
  SRC_URL: https://github.com/leanprover/con-leche
  SRC_REV: 78ded4b6fc9a4d9ab809e8ca2c75c56537c41bff
  EXPORTS_RUN: 44313744961
  BASE_SHA: 3177d60

jobs:
  export:
    name: export con-leche
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install elan and zstd
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y zstd >/dev/null
      - name: Source
        run: |
          mkdir -p work/src && cd work/src
          git init -q && git remote add origin "$SRC_URL"
          git fetch -q --depth 1 origin "$SRC_REV" && git checkout -q FETCH_HEAD
      - name: Build lean4export
        run: |
          git clone -q --branch master https://github.com/leanprover/lean4export lean4export
          cp work/src/lean-toolchain lean4export/lean-toolchain
          cd lean4export && git rev-parse HEAD && lake build
      - name: Build module (lka.py)
        working-directory: work/src
        run: lake build ConLecheTests
      - name: Export (lka.py run_lean4export)
        working-directory: work/src
        run: |
          X="$GITHUB_WORKSPACE/lean4export/.lake/build/bin/lean4export"
          lake env "$X" ConLecheTests -- ConLeche.model_exists ConLeche.no_proof_of_False ConLeche.Frontend.scanLineSpec_eq_scanLineFwd > "$GITHUB_WORKSPACE/con-leche.ndjson"
          cd "$GITHUB_WORKSPACE"
          { ls -la con-leche.ndjson; wc -l con-leche.ndjson; sha256sum con-leche.ndjson; echo "board: b9ad1d958705760c6eb1c5cf3974ec0a4a3eb9dd765ff0648782fa49dee94a7f 551412545 bytes 10043114 lines"; } | tee -a "$GITHUB_STEP_SUMMARY"
          zstd -q -T0 -10 --rm con-leche.ndjson -o con-leche.ndjson.zst
      - uses: actions/upload-artifact@v4
        with:
          name: export-con-leche
          path: con-leche.ndjson.zst
          compression-level: 0
          retention-days: 30

  con-leche:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        side: [base, fix, noite]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          SIDE: ${{ matrix.side }}
        run: |
          [ "$SIDE" = base ] && git checkout -q "$BASE_SHA"
          git log --oneline -1
          cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-con-leche
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm con-leche.ndjson.zst -o con-leche.ndjson
          extra="A=1"; [ "$SIDE" = noite ] && extra="KIOTA_NO_ITE_SHORTCUT=1"
          # the arena's own invocation first: verdict and cost without diagnostics
          env $extra /usr/bin/time -v -o time.txt timeout 720 ./target/release/kiota con-leche.ndjson >/dev/null 2>err0.txt; rc=$?
          {
            echo "CL corpus=con-leche side=$SIDE mode=plain rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}')"
            grep -E '^(REJECT|DECLINE|ERROR)' err0.txt | cut -c1-600
            env $extra KIOTA_KEEP_GOING=1 KIOTA_STATS=1 /usr/bin/time -v -o time.txt timeout 3000 ./target/release/kiota con-leche.ndjson >/dev/null 2>err.txt; rc=$?
            echo "CL corpus=con-leche side=$SIDE mode=keep-going rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') declines=$(grep -c '^DECLINE-CONT' err.txt) $(grep -E '^STATS ' err.txt | tail -1)"
            grep -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-600 | head -300
          } | tee -a "$GITHUB_STEP_SUMMARY"

  corpus:
    strategy:
      fail-fast: false
      matrix:
        corpus: [init, std, cedar, cslib, mathlib]
        side: [base, fix, noite]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          SIDE: ${{ matrix.side }}
        run: |
          [ "$SIDE" = base ] && git checkout -q "$BASE_SHA"
          git log --oneline -1
          cargo build --release --locked
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run
        env:
          SIDE: ${{ matrix.side }}
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          extra="A=1"; [ "$SIDE" = noite ] && extra="KIOTA_NO_ITE_SHORTCUT=1"
          env $extra KIOTA_STATS=1 /usr/bin/time -v -o time.txt ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          {
            echo "CL corpus=$C side=$SIDE rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -E '^STATS ' err.txt | tail -1)"
            grep -E '^STATS[23]' err.txt | tail -2
            grep -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-600 | head -20
          } | tee -a "$GITHUB_STEP_SUMMARY"
