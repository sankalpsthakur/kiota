name: remote-unit

# The three library-interpreter regression tests on main 01f05ae, without
# the fix: each must fail there (harness only, not for main).
on:
  push:
    branches: ['remote/eta-test-on-base']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the new tests on the old code
        run: |
          for t in structure_eta_requires_equal_types structure_eta_still_identifies_a_term_with_its_constructor_of_projections; do
            set +e
            cargo test --release --locked "$t" > "$t.log" 2>&1
            rc=$?
            set -e
            echo "== $t rc=$rc"
            grep -E "panicked at|^Err|read as|test result" "$t.log" | head -6
          done
