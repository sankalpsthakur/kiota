name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Test strict remote supervisor with fake binaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/remote/tests -v
