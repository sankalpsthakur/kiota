name: remote-ab-corpus

# A/B a checker change against its baseline on the arena's real large
# exports (byte-verified Lean 4.34.1 builds from regenerate-arena-corpus),
# with the arena's own per-test timeouts. Unit tests cannot show that a
# soundness guard still admits genuine Lean input; these corpora can.
on:
  push:
    branches: ['remote/ab-extra-3']

permissions:
  contents: read
  actions: read

env:
  BASELINE_SHA: 5788b65dec44feb79c3cd4516e1066e640bba62b
  EXPORTS_RUN: '37534509955'

jobs:
  run:
    name: ${{ matrix.corpus }} / ${{ matrix.side }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The remaining large tests on fix/lazy-delta-lean-step (0dbc0d8) with
        # the keep-going diagnostic (KIOTA_CONTINUE), the arena's limits, and
        # the conversion stack at the first depth-limit decline per declaration.
        # Cedar runs under a 14 GB address-space cap instead of killing the runner.
        side: [candidate]
        corpus: [con-leche, cedar]
        include:
          - corpus: con-leche
            limit: 720
            run: '37567635092'
            cap: 0
            extra: ''
          - corpus: cedar
            limit: 940
            run: '37534509955'
            cap: 12000000
            extra: 'KIOTA_MIN_DECL=38131 KIOTA_MAX_DECL=38131 KIOTA_STATS=1 KIOTA_CACHE_ALARM=20000000 KIOTA_PP_BUDGET=300'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select source
        run: |
          if [ "${{ matrix.side }}" = baseline ]; then git checkout -q "$BASELINE_SHA"; fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Fetch verified export
        uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        env:
          CORPUS: ${{ matrix.corpus }}
          LIMIT: ${{ matrix.limit }}
          SIDE: ${{ matrix.side }}
          CAP: ${{ matrix.cap }}
          EXTRA: ${{ matrix.extra }}
        run: |
          sudo apt-get install -y zstd >/dev/null
          zstd -d --rm "$CORPUS.ndjson.zst" -o "$CORPUS.ndjson"
          set +e
          start=$(date +%s.%N)
          cat > stamp.py <<'PY'
          import sys, time
          t0 = time.monotonic()
          for line in sys.stdin:
              sys.stdout.write(f"{time.monotonic() - t0:.3f} {line}")
              sys.stdout.flush()
          PY
          # KIOTA_TRACE_CONVERSION dumps the active comparison stack at any
          # depth limit (first per declaration), recovered or not.
          if [ "$CAP" != 0 ]; then ulimit -v "$CAP"; fi
          env $EXTRA KIOTA_CONTINUE=1 KIOTA_PROGRESS=1 KIOTA_TRACE_CONVERSION=1 /usr/bin/time -v -o time.txt timeout "$LIMIT" ./target/release/kiota "$CORPUS.ndjson" \
            2>&1 > out.txt | python3 -u stamp.py > stamped.txt
          rc=${PIPESTATUS[0]}
          end=$(date +%s.%N)
          sed -E 's/^[0-9.]+ //' stamped.txt > err.txt
          cat time.txt >> err.txt
          python3 scripts/remote/decl_profile.py stamped.txt "$LIMIT" > "profile-$CORPUS-$SIDE.txt" || true
          grep "CONTINUE_PAST" stamped.txt | cut -c1-600 > "failures-$CORPUS-$SIDE.txt" || true
          grep -E "^[0-9.]+ (MEM |CACHE_ALARM|CONVERSION_|INTERN_CALLS|memory alloc)" stamped.txt | cut -c1-3000 | tail -400 > "diag-$CORPUS-$SIDE.txt" || true
          echo "failures: $(wc -l < failures-$CORPUS-$SIDE.txt)"; head -40 "failures-$CORPUS-$SIDE.txt"
          gzip -9 stamped.txt
          set -e
          rss_kb=$(grep "Maximum resident set size" err.txt | awk '{print $NF}')
          cat out.txt err.txt | grep -m1 -E "^(REJECT|DECLINE)" | cut -c1-300 > verdict.txt || true
          python3 - <<PY > "result-$CORPUS-$SIDE.json"
          import json
          rc = $rc
          outcome = {0: "accept", 1: "reject", 2: "decline", 124: "timeout", 137: "killed"}.get(rc, f"exit-{rc}")
          print(json.dumps({
              "corpus": "$CORPUS", "side": "$SIDE", "source": "$SOURCE_SHA",
              "outcome": outcome, "exit_code": rc,
              "wall_seconds": round($end - $start, 2), "limit_seconds": $LIMIT,
              "peak_rss_mib": int(("${rss_kb:-0}" or "0")) // 1024,
              "first_verdict_line": open("verdict.txt", errors="replace").read().strip(),
          }, indent=2))
          PY
          cat "result-$CORPUS-$SIDE.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.corpus }}-${{ matrix.side }}
          path: result-${{ matrix.corpus }}-${{ matrix.side }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.corpus }}-${{ matrix.side }}
          path: |
            profile-${{ matrix.corpus }}-${{ matrix.side }}.txt
            failures-${{ matrix.corpus }}-${{ matrix.side }}.txt
            diag-${{ matrix.corpus }}-${{ matrix.side }}.txt
            stamped.txt.gz

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
      - name: Candidate results (compare against the baseline runs named above)
        run: |
          for f in result-*.json; do cat "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"
