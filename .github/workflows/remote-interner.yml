name: remote-interner

# Old binary (OLD_REF) against this branch's, same runner: user time on std
# in alternating order, then counters and verdicts with KIOTA_STATS=1.
on:
  push:
    branches: ['remote/interner-2026*']

permissions:
  contents: read
  actions: read

env:
  EXPORTS_RUN: 44313744961
  OLD_REF: e593b7930975363769847599d973c26aa599c102

jobs:
  time:
    strategy:
      fail-fast: false
      matrix:
        order: ['old new old new', 'new old new old']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both
        run: |
          cargo build --release --locked
          cp target/release/kiota kiota-new
          git worktree add ../old "$OLD_REF"
          (cd ../old && CARGO_TARGET_DIR=$PWD/target cargo build --release --locked)
          cp ../old/target/release/kiota kiota-old
      - uses: actions/download-artifact@v4
        with:
          name: export-std
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Timed runs
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm std.ndjson.zst -o std.ndjson
          nproc; grep -m1 'model name' /proc/cpuinfo
          i=0
          for side in $ORDER; do
            i=$((i+1))
            /usr/bin/time -v -o time.txt ./kiota-$side std.ndjson >/dev/null 2>err.txt; rc=$?
            echo "TIME run=$i side=$side rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') sys=$(grep 'System time' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-100)"
          done | tee -a "$GITHUB_STEP_SUMMARY"

  stats:
    strategy:
      fail-fast: false
      matrix:
        corpus: [init, std]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build both
        run: |
          cargo build --release --locked
          cp target/release/kiota kiota-new
          git worktree add ../old "$OLD_REF"
          (cd ../old && CARGO_TARGET_DIR=$PWD/target cargo build --release --locked)
          cp ../old/target/release/kiota kiota-old
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Counters and verdicts
        env:
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          for side in old new; do
            KIOTA_STATS=1 KIOTA_INTERN_RESET_LOG=1 /usr/bin/time -v -o time.txt ./kiota-$side $C.ndjson >/dev/null 2>err-$side.txt; rc=$?
            echo "STAT corpus=$C side=$side rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') resets=$(grep -c '^INTERN_RESET' err-$side.txt) $(grep -E '^STATS ' err-$side.txt | tail -1) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err-$side.txt | cut -c1-100)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          # Everything the two binaries print must agree, counters included.
          grep -E '^(STATS|STATS2|STATS3|INTERN_RESET|REJECT|DECLINE|ERROR)' err-old.txt > a.txt
          grep -E '^(STATS|STATS2|STATS3|INTERN_RESET|REJECT|DECLINE|ERROR)' err-new.txt > b.txt
          if cmp -s a.txt b.txt; then echo "STATCMP corpus=$C IDENTICAL lines=$(wc -l < a.txt)"; else echo "STATCMP corpus=$C DIFFERENT"; diff a.txt b.txt | head -20; fi | tee -a "$GITHUB_STEP_SUMMARY"
