name: remote-nestedproj

# snd/nested-proj (constructor types checked with nested occurrences
# rewritten to auxiliary types, as Lean's elim_nested_inductive_fn does) beside
# main f7c0960 on the arena's six Lean 4.36 exports, strict, one process each:
# verdict, user time, peak memory. Both refs are pinned by sha. Every arena
# tarball case runs on both sides (perf cases in `perf`, the rest in
# `tarball`). The mutant job shows the new tests kill the parts of the check.
on:
  push:
    branches: ['remote/nestedproj-2026112*']
permissions:
  contents: read
  actions: read
env:
  HEAD_SHA: 43d7dd009a4ada8d83c6262068c6c8a2fe9c416e
  MAIN: f7c09605e8fe7dc7ddcb3b1650aeb259793ee3aa
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
        corpus: [init, std, cedar, cslib, mathlib, con-leche]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Free disk
        if: matrix.corpus == 'mathlib' || matrix.corpus == 'con-leche'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && '45661537211' || '45472434965' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          ls -la $C.ndjson; sha256sum $C.ndjson; df -h .
          [ "$C" = mathlib ] && export KIOTA_PROGRESS=1
          start=$(date +%s)
          # Kill past 13 GB RSS so a runaway ends with its declaration named.
          /usr/bin/time -v -o time.txt timeout 15000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt &
          pid=$!
          while kill -0 $pid 2>/dev/null; do
            k=$(pgrep -x kiota | head -1)
            if [ -n "$k" ]; then
              rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
              if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" | tee -a err.txt; kill -9 $k; fi
            fi
            sleep 2
          done
          wait $pid; rc=$?
          wall=$(( $(date +%s) - start ))
          grep -v '^\[decl' err.txt | tail -c 3000
          echo "last progress: $(grep '^\[decl' err.txt | tail -1)"
          echo "FULL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc wall=${wall}s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"

  perf:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Arena tarball perf cases
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y time >/dev/null
          mkdir -p arena && curl -sL https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena.tgz
          sha256sum arena.tgz; tar -xzf arena.tgz -C arena
          sha=$(git rev-parse --short HEAD)
          one() {  # <file> <timeout>; extra env comes from the caller
            /usr/bin/time -v -o time.txt timeout $2 ./target/release/kiota "$1" >/dev/null 2>err.txt &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              k=$(pgrep -x kiota | head -1)
              if [ -n "$k" ]; then
                rss=$(ps -o rss= -p $k 2>/dev/null | tr -d ' ')
                if [ "${rss:-0}" -gt 13000000 ]; then echo "MEMKILL rss_kb=$rss" >> err.txt; kill -9 $k; fi
              fi
              sleep 1
            done
            wait $pid; rc=$?
          }
          for f in $(ls arena/good/perf/*.ndjson arena/bad/perf/*.ndjson); do
            case_=${f#arena/}
            one "$f" 1800
            echo "PERF side=$SIDE sha=$sha case=$case_ rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') wall=$(grep 'Elapsed (wall' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR|MEMKILL)' err.txt | cut -c1-200)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  tarball:
    strategy:
      fail-fast: false
      matrix:
        side: [head, main]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'main' && env.MAIN || env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Arena tarball, every case outside perf/
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          mkdir -p arena && curl -sL https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena.tgz
          sha256sum arena.tgz; tar -xzf arena.tgz -C arena
          sha=$(git rev-parse --short HEAD)
          for f in $(cd arena && find good bad -name '*.ndjson' -not -path '*/perf/*' | sort); do
            timeout 1800 ./target/release/kiota "arena/$f" >/dev/null 2>err.txt; rc=$?
            echo "TB side=$SIDE sha=$sha case=$f rc=$rc $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-160)" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  mutant:
    strategy:
      fail-fast: false
      matrix:
        mutant: [base, X1_no_aux_check, X2_no_rewrite, X3_no_sig_check, X4_aux_index_ignores_params, X5_aux_not_applied_to_params, X6_aux_drops_indices, X7_orig_members_skipped]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply mutant
        env:
          MUT: ${{ matrix.mutant }}
        run: |
          python3 - <<'PY'
          import os
          R = "src/tc/recursor.rs"
          M = {
            "base": [],
            "X1_no_aux_check": [(R, "        self.check_nested_aux_constructors(&all, num_params, &discovery_members)?;\n", "")],
            "X2_no_rewrite": [(R, "            let (_, args) = expr::unfold_apps(e);\n            let mut r = expr::bvar(local_depth + num_params + j as u32);", "            if j < usize::MAX { return Ok(e.clone()); }\n            let (_, args) = expr::unfold_apps(e);\n            let mut r = expr::bvar(local_depth + num_params + j as u32);")],
            "X3_no_sig_check": [(R, "            if Checker::mentions_any(&member.typ, original_names, &mut Default::default()) {", "            if false && Checker::mentions_any(&member.typ, original_names, &mut Default::default()) {")],
            "X4_aux_index_ignores_params": [(R, "let mut r = expr::bvar(local_depth + num_params + j as u32);", "let mut r = expr::bvar(local_depth + j as u32);")],
            "X5_aux_not_applied_to_params": [(R, "            for i in 0..num_params {\n                r = expr::app(r, expr::bvar(local_depth + num_params - 1 - i));\n            }\n", "")],
            "X6_aux_drops_indices": [(R, "            for a in &args[occ.source_num_params as usize..] {\n                r = expr::app(r, a.clone());\n            }\n", "            let _ = &args;\n")],
            "X7_orig_members_skipped": [(R, "        for member in members {\n            for ctor in &member.ctors {\n                let mut params", "        for member in aux {\n            for ctor in &member.ctors {\n                let mut params")],
          }
          for path, old, new in M[os.environ["MUT"]]:
              s = open(path).read()
              assert s.count(old) == 1, (path, old)
              open(path, "w").write(s.replace(old, new))
          PY
          git diff --stat
      - name: Build and test
        shell: bash
        run: |
          set +e
          cargo test --release --locked --no-fail-fast > test.log 2>&1; trc=$?
          failed=$(grep -E '^test .* FAILED$' test.log | awk '{print $2}' | tr '\n' ' ')
          passed=$(grep -E '^test result:' test.log | awk '{s+=$4} END{print s}')
          grep -E '^test result:|panicked|^error' test.log | head -40
          echo "MUT ${{ matrix.mutant }} sha=$(git rev-parse --short HEAD) test_rc=$trc passed=$passed failed=[$failed]" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
