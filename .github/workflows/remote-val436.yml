name: remote-val436

# Each candidate branch on the arena's Lean 4.36 exports (init, std, cedar,
# cslib), strict, one process: verdict, user time, peak memory.
on:
  push:
    branches: ['remote/val436-*']
permissions:
  contents: read
  actions: read
env:
  EXPORTS_RUN: 45472434965
jobs:
  val:
    strategy:
      fail-fast: false
      matrix:
        side: [main, snd/export-names, snd/validated-extensions, snd/inductive-audit, snd/interner-memory, fix/deep-evaluation]
        corpus: [init, std, cedar, cslib]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        env:
          C: ${{ matrix.corpus }}
          SIDE: ${{ matrix.side }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          /usr/bin/time -v -o time.txt timeout 5000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          echo "VAL side=$SIDE sha=$(git rev-parse --short HEAD) corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-250)" | tee -a "$GITHUB_STEP_SUMMARY"
