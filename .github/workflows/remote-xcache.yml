name: remote-xcache

# off / KIOTA_XCACHE / KIOTA_XCACHE+KIOTA_XMEMO: verdict, counters, user
# time and peak memory on init and std, same binary, same runner.
on:
  push:
    branches: ['remote/xcache-2026*']

permissions:
  contents: read
  actions: read

env:
  EXPORTS_RUN: 44313744961

jobs:
  xcache:
    strategy:
      fail-fast: false
      matrix:
        corpus: [init, std]
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Three configurations
        env:
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          for side in off xcache both; do
            extra=""; [ $side = xcache ] && extra="KIOTA_XCACHE=1"; [ $side = both ] && extra="KIOTA_XCACHE=1 KIOTA_XMEMO=1"
            env $extra KIOTA_STATS=1 /usr/bin/time -v -o time.txt ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
            echo "XC3 corpus=$C side=$side rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') $(grep -E '^STATS3' err.txt | tail -1) $(grep -E '^STATS ' err.txt | tail -1) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-100)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
