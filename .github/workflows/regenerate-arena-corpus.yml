name: regenerate-arena-corpus

# Rebuilds Lean Kernel Arena exports with the arena's own
# recipe (lka.py: setup_source_directory / setup_lean4export / create_test)
# and proves byte identity against the hashes the live board publishes.
# Heavy work runs here, never on a developer machine.
on:
  push:
    branches: ['remote/corpus-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arena revision that produced the board these hashes come from.
  ARENA_REV: b1d6e91d6de351f9bcf21e6b039f4d51d6b9bb42

jobs:
  export:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: con-leche
            kind: module
            url: https://github.com/leanprover/con-leche
            rev: 78ded4b6fc9a4d9ab809e8ca2c75c56537c41bff
            module: ConLecheTests
            decls: ConLeche.model_exists ConLeche.no_proof_of_False ConLeche.Frontend.scanLineSpec_eq_scanLineFwd
            sha256: b9ad1d958705760c6eb1c5cf3974ec0a4a3eb9dd765ff0648782fa49dee94a7f
            size: 551412545
            lines: 10043114
          - name: navier-stokes-euler
            kind: module
            url: https://github.com/openai/NavierStokesAndEuler/
            rev: f9e8bc5b38b6e212696e8a30e3e91517af887bbd
            module: NavierStokes.Arena
            prebuild: lake exe cache get && printf 'import NavierStokes.ComparatorSolution\nimport Euler.Solution\n' > NavierStokes/Arena.lean
            decls: NavierStokes.Comparator.navier_stokes_breakdown_R3 NavierStokes.Comparator.navier_stokes_breakdown_periodic Euler.euler_breakdown_R3 Euler.exists_compact_smooth_euler_singularity
            sha256: 632943fca6795d48bc13e703aabfaef39931f9445f1275d2150a44f4de7b55e6
            size: 1559685706
            lines: 28569038
    env:
      NAME: ${{ matrix.name }}
      KIND: ${{ matrix.kind }}
      LEANFILE: ${{ matrix.leanfile }}
      SRC_URL: ${{ matrix.url }}
      SRC_REV: ${{ matrix.rev }}
      MODULE: ${{ matrix.module }}
      PREBUILD: ${{ matrix.prebuild }}
      EXPORT_DECLS: ${{ matrix.decls }}
      WANT_SHA256: ${{ matrix.sha256 }}
      WANT_SIZE: ${{ matrix.size }}
      WANT_LINES: ${{ matrix.lines }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4
        with:
          path: kiota

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install elan and zstd
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y zstd >/dev/null

      - name: Fetch arena test spec at the board's revision
        run: |
          git init -q arena && cd arena
          git remote add origin https://github.com/leanprover/lean-kernel-arena
          git fetch -q --depth 1 origin "$ARENA_REV"
          git checkout -q FETCH_HEAD

      - name: Prepare source (lka.py setup_source_directory)
        run: |
          mkdir -p work/src && cd work/src
          if [ "$KIND" = leanfile ]; then
            cp "$GITHUB_WORKSPACE/arena/$LEANFILE" Test.lean
            cp "$GITHUB_WORKSPACE/arena/tests/lean-toolchain" lean-toolchain
            printf 'name = "test"\n\n[[lean_lib]]\nname = "Test"' > lakefile.toml
          else
            git init -q
            git remote add origin "$SRC_URL"
            git fetch -q --depth 1 origin "$SRC_REV"
            git checkout -q FETCH_HEAD
          fi
          echo "toolchain: $(cat lean-toolchain)"

      - name: Build lean4export for this toolchain (lka.py setup_lean4export)
        run: |
          git clone -q --branch master https://github.com/leanprover/lean4export lean4export
          cp work/src/lean-toolchain lean4export/lean-toolchain
          cd lean4export
          echo "lean4export master: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          lake build

      - name: Pre-build
        if: matrix.prebuild != ''
        working-directory: work/src
        run: bash -c "$PREBUILD"

      - name: Build module
        working-directory: work/src
        run: |
          MOD="${MODULE:-Test}"
          lake build "$MOD"

      - name: Export (lka.py run_lean4export)
        working-directory: work/src
        run: |
          MOD="${MODULE:-Test}"
          start=$(date +%s)
          # lka.py run_lean4export: `-- decl...` when the test lists export-decls.
          lake env "$GITHUB_WORKSPACE/lean4export/.lake/build/bin/lean4export" "$MOD" \
            ${EXPORT_DECLS:+-- $EXPORT_DECLS} > "$GITHUB_WORKSPACE/$NAME.ndjson"
          echo "EXPORT_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          df -h /

      - name: Verify against the board
        run: python3 "$GITHUB_WORKSPACE/kiota/scripts/remote/verify_export.py" "$NAME.ndjson" > "$NAME.verify.json"

      - name: Report
        if: always()
        run: |
          [ -f "$NAME.verify.json" ] && cat "$NAME.verify.json" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.name }}
          path: ${{ matrix.name }}.verify.json
          if-no-files-found: ignore
          retention-days: 90

      # Kept even on a mismatch: a differing export is the evidence needed to
      # explain the difference, so it must not be discarded with the job.
      - name: Compress export
        if: always()
        run: |
          [ -f "$NAME.ndjson" ] || exit 0
          zstd -T0 -10 --rm "$NAME.ndjson" -o "$NAME.ndjson.zst" && ls -la "$NAME.ndjson.zst"

      - name: Upload export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ matrix.name }}
          path: ${{ matrix.name }}.ndjson.zst
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

      - name: Fail unless byte-identical
        run: python3 -c "import json,sys; sys.exit(0 if json.load(open('$NAME.verify.json'))['byte_identical'] else 1)"
