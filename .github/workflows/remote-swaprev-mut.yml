name: remote-swaprev-mut

# Independent review: mutation test of every new guard of fix/mathlib-swap-v2
# at the reviewed sha bcb623d. Each job removes one guard
# (review/swaprev_mutate.py) and runs the committed suite in release mode.
# A mutant survives when cargo test stays green.
on:
  push:
    branches: ['remote/swaprev-mut-*']
permissions:
  contents: read
env:
  HEAD_SHA: bcb623d3ae6ddb1e57b9be4c908022776d815645
jobs:
  mut:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mutant: [none, frm_frame_not_reset, decl_depth_abandoned]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: src-tree
      - uses: dtolnay/rust-toolchain@stable
      - name: Mutate and test
        working-directory: src-tree
        env:
          MUT: ${{ matrix.mutant }}
        run: |
          set +e
          git rev-parse HEAD
          python3 ../harness/review/swaprev_mutate.py "$MUT"; mrc=$?
          git diff --stat
          if [ $mrc -ne 0 ]; then echo "MUT name=$MUT apply=FAILED"; exit 1; fi
          cargo build --release --locked --tests 2>&1 | tail -5; brc=${PIPESTATUS[0]}
          if [ $brc -ne 0 ]; then echo "MUT name=$MUT build=FAILED" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          timeout 2400 cargo test --release --locked --no-fail-fast > test.log 2>&1; trc=$?
          grep -E '^test result:' test.log
          failed=$(grep -E '^test .* FAILED$' test.log | sed 's/^test //; s/ \.\.\. FAILED//' | sort -u | tr '\n' ' ')
          passed=$(grep -E '^test result:' test.log | awk '{s+=$4} END {print s}')
          echo "MUT name=$MUT test_rc=$trc passed=$passed failed=[$failed]" | tee -a "$GITHUB_STEP_SUMMARY"
