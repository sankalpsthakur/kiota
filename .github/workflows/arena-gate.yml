name: arena-small-suite
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: arena-small-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [default, nbe]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the gate itself
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Unit and export tests, release
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = nbe ]; then
            KIOTA_NBE=1 cargo test --release --locked
          else
            cargo test --release --locked
          fi
      - name: Build release checker
        run: cargo build --release --locked
      - name: Capture the published small suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arena-input
          curl --fail --location --retry 3 --max-time 120 --proto '=https' \
            https://arena.lean-lang.org/results.json -o arena-input/results-before.json
          curl --fail --location --retry 3 --max-time 120 --proto '=https' \
            https://arena.lean-lang.org/lean-arena-tests.tar.gz -o arena-input/tests.tar.gz
          curl --fail --location --retry 3 --max-time 120 --proto '=https' \
            https://arena.lean-lang.org/results.json -o arena-input/results-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('arena-input/results-before.json').read_text())['meta']
          after = json.loads(Path('arena-input/results-after.json').read_text())['meta']
          if before != after:
              raise SystemExit('Arena changed while downloading; rerun for a stable snapshot')
          print(json.dumps(before, indent=2))
          PY
          git rev-parse HEAD > arena-input/checkout-sha.txt
          sha256sum arena-input/tests.tar.gz target/release/kiota > arena-input/checksums.sha256
          git archive --format=tar.gz HEAD > arena-input/source.tar.gz
          rustc --version --verbose > arena-input/toolchain.txt
      - name: Preserve inputs before running the checker
        uses: actions/upload-artifact@v4
        with:
          name: arena-input-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            arena-input/
            target/release/kiota
          if-no-files-found: error
          retention-days: 14
      - name: Strict small-suite gate
        timeout-minutes: 12
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 scripts/arena_gate.py \
            --binary target/release/kiota --archive arena-input/tests.tar.gz \
            --output arena-report --mode "$MODE" --min-good 119 --min-bad 70 \
            --memory-mib 4096
      - name: Retain verdicts and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-report-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: arena-report/
          if-no-files-found: warn
          retention-days: 14
