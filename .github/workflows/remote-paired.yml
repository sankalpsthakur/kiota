name: remote-paired

# Same-runner timing: build the baseline and the candidate, then run each on
# the same export alternately, twice. Cross-job runner speed varies by 30%+.
on:
  push:
    branches: ['remote/paired-std']

permissions:
  contents: read
  actions: read

env:
  BASELINE_SHA: 3a6c32260730ef207c5d3ee0817ef6ae6a6efb80
  EXPORTS_RUN: '37534509955'

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build candidate and baseline
        run: |
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cargo build --release --locked && cp target/release/kiota kiota-cand
          git checkout -q "$BASELINE_SHA" && cargo build --release --locked && cp target/release/kiota kiota-base
          git checkout -q -
      - uses: actions/download-artifact@v4
        with:
          name: export-std
          run-id: ${{ env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Alternate runs
        run: |
          sudo apt-get install -y zstd >/dev/null
          zstd -d --rm std.ndjson.zst -o std.ndjson
          for round in 1 2; do
            for side in base cand; do
              start=$(date +%s.%N)
              KIOTA_PROGRESS=1 timeout 900 ./kiota-$side std.ndjson 2> err-$side-$round.txt > /dev/null; rc=$?
              end=$(date +%s.%N)
              decls=$(grep -c '\[decl #' err-$side-$round.txt)
              echo "PAIRED round=$round side=$side rc=$rc wall=$(python3 -c "print(round($end-$start,1))") decls=$decls $(grep -m1 LIFETIMES err-$side-$round.txt || true)"
            done
          done | tee paired.txt
          cat paired.txt >> "$GITHUB_STEP_SUMMARY"
