name: remote-validated-extensions

# snd/validated-extensions on every corpus, strict, one process each, as
# remote-integrate4 ran origin/main (run 44380394633); and once more with
# KIOTA_EXT_TRACE, for which extension constants validated and how often
# each native rule fired.
on:
  push:
    branches: ['remote/validated-extensions-2026*']

permissions:
  contents: read
  actions: read

env:
  EXPORTS_RUN: 44313744961
  CL_EXPORT_RUN: 44328282978

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        corpus: [mathlib, cedar, cslib, std, init, con-leche]
        mode: [strict, trace]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: export-${{ matrix.corpus }}
          run-id: ${{ matrix.corpus == 'con-leche' && env.CL_EXPORT_RUN || env.EXPORTS_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Strict run
        if: matrix.mode == 'strict'
        env:
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          nproc; free -g | head -2
          head -c 400 $C.ndjson | head -1
          KIOTA_PROGRESS=1 /usr/bin/time -v -o time.txt timeout 20000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          echo "FULL corpus=$C rc=$rc decls=$(grep -c '\[decl #' err.txt) last=$(grep -o '\[decl #[0-9]*\]' err.txt | tail -1) wall=$(grep Elapsed time.txt | awk '{print $NF}') user=$(grep 'User time' time.txt | awk '{print $NF}') maxrss_kb=$(grep 'Maximum resident' time.txt | awk '{print $NF}') ext_off=$(grep -c 'is not the constant the kernel assumes' err.txt) $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-300)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'is not the constant the kernel assumes' err.txt | head -40
          test "$rc" = 0 && ! grep -q 'is not the constant the kernel assumes' err.txt
      - name: Trace run
        if: matrix.mode == 'trace'
        env:
          C: ${{ matrix.corpus }}
        run: |
          set +e
          sudo apt-get install -y zstd time >/dev/null
          zstd -d --rm $C.ndjson.zst -o $C.ndjson
          KIOTA_EXT_TRACE=1 /usr/bin/time -v -o time.txt timeout 20000 ./target/release/kiota $C.ndjson >/dev/null 2>err.txt; rc=$?
          echo "TRACE corpus=$C rc=$rc user=$(grep 'User time' time.txt | awk '{print $NF}') ext_off=$(grep -c 'is not the constant the kernel assumes' err.txt) on=[$(grep '^EXT on ' err.txt | sed 's/^EXT on //' | tr '\n' ' ')] $(grep -m1 -E '^(REJECT|DECLINE|ERROR)' err.txt | cut -c1-300)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TRACEFIRED corpus=$C $(grep '^EXT fired' err.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep 'is not the constant the kernel assumes' err.txt | head -40
          test "$rc" = 0 && ! grep -q 'is not the constant the kernel assumes' err.txt

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked 2>&1 | grep -E '^test result|FAILED|failed|panicked' | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo test --release --locked
